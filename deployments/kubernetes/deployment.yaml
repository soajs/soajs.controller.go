apiVersion: apps/v1
kind: Deployment
metadata:
  name: soajs-controller
  labels:
    app: soajs-controller
    soajs.service: "true"
    soajs.service.name: controller
    soajs.service.version: "1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: soajs-controller
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: soajs-controller
        soajs.service: "true"
        soajs.service.name: controller
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: controller
          image: soajs/controller-go:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
            - name: maintenance
              containerPort: 5000
              protocol: TCP
          env:
            - name: SOAJS_ENV
              value: "dashboard"
            - name: SOAJS_DEPLOY_HA
              value: "kubernetes"
            - name: SOAJS_MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: soajs-secrets
                  key: mongo-uri
            - name: SOAJS_LOG_LEVEL
              value: "info"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /heartbeat
              port: maintenance
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /heartbeat
              port: maintenance
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: soajs-controller
                topologyKey: kubernetes.io/hostname
