services:
  controller:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    ports:
      - "4000:4000"   # gateway port (SOAJS_SERVICE_PORT)
      - "5000:5000"   # maintenance port: the registry's ports.controller + ports.maintenanceInc
    # The variables are described in docs/configuration.md. The mongo below must hold the SOAJS
    # data (core_provision with the environment, resources, marketplace, tenants, products) for
    # the gateway to load its registry; this file does not create it.
    environment:
      - SOAJS_ENV=dashboard
      - SOAJS_PROFILE=/app/profile.js
      - SOAJS_SERVICE_PORT=4000
      - SOAJS_LOG_LEVEL=debug
    volumes:
      - ./profile.js:/app/profile.js:ro   # the profile of the mongo service below
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/heartbeat"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - soajs

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - soajs

networks:
  soajs:
    driver: bridge

volumes:
  mongo_data:
