version: '3.8'

services:
  controller:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    ports:
      - "4000:4000"   # API port
      - "5000:5000"   # Maintenance port
    environment:
      # Required: Environment name (e.g., dashboard, dev, production)
      - SOAJS_ENV=dashboard
      # MongoDB connection (Go uses direct URI, not SOAJS_PROFILE)
      - SOAJS_MONGO_URI=mongodb://mongo:27017
      - SOAJS_MONGO_DATABASE=core_provision
      # Logging
      - SOAJS_LOG_LEVEL=debug
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/heartbeat"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - soajs

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - soajs

networks:
  soajs:
    driver: bridge

volumes:
  mongo_data:
