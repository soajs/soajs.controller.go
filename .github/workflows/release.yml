name: Release

on:
  push:
    branches:
      - release
      - 'release/**'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Download dependencies
        run: go mod download

      - name: Run vet
        run: go vet ./...

      - name: Run unit tests
        run: go test ./... -v -race

      - name: Import test data
        run: go run ./test/data/cmd/import.go -uri=mongodb://127.0.0.1:27017 -db=core_provision

      - name: Build controller
        run: go build -o controller ./cmd/controller

      - name: Run integration tests
        env:
          INTEGRATION_TEST: "true"
          SOAJS_ENV: "dev"
          SOAJS_MONGO_URI: "mongodb://127.0.0.1:27017"
          SOAJS_MONGO_DATABASE: "core_provision"
        run: |
          ./controller &
          CONTROLLER_PID=$!
          for i in {1..30}; do
            if curl -s http://127.0.0.1:5001/heartbeat > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          go test -v ./test/integration/...
          TEST_EXIT=$?
          kill $CONTROLLER_PID 2>/dev/null || true
          exit $TEST_EXIT

  publish-docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from version.json
        id: version
        run: |
          PACKAGE_VERSION=$(jq -r '.version' pkg/version/version.json)
          MAJOR_VERSION=$(echo ${PACKAGE_VERSION} | awk -F. '{ print $1 }')
          echo "PACKAGE_VERSION=${PACKAGE_VERSION}" >> $GITHUB_OUTPUT
          echo "MAJOR_VERSION=${MAJOR_VERSION}" >> $GITHUB_OUTPUT
          echo "Package version: ${PACKAGE_VERSION}"
          echo "Major version: ${MAJOR_VERSION}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deployments/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            soajsorg/gateway-go:latest
            soajsorg/gateway-go:${{ steps.version.outputs.PACKAGE_VERSION }}
            soajsorg/gateway-go:${{ steps.version.outputs.MAJOR_VERSION }}.x

      - name: Create Git tag
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.PACKAGE_VERSION }} || true

      - name: Push tag
        run: git push origin ${{ steps.version.outputs.PACKAGE_VERSION }} || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.PACKAGE_VERSION }}
          name: Release ${{ steps.version.outputs.PACKAGE_VERSION }}
          generate_release_notes: true
          files: |
            deployments/kubernetes/*.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-binaries:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Extract version
        id: version
        run: |
          PACKAGE_VERSION=$(jq -r '.version' pkg/version/version.json)
          echo "PACKAGE_VERSION=${PACKAGE_VERSION}" >> $GITHUB_OUTPUT

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXT=".exe"
          fi
          go build -ldflags="-w -s -X main.Version=${{ steps.version.outputs.PACKAGE_VERSION }}" \
            -o controller-${{ matrix.goos }}-${{ matrix.goarch }}${EXT} \
            ./cmd/controller

      - name: Upload binary to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.PACKAGE_VERSION }}
          files: controller-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
